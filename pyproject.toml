[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geode-transfer"
version = "0.1.0"
description = "Move Geode data (saves, mods, settings) between iPhones and iPads from a Mac."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Kisnner Obando" }]
keywords = ["geode", "geometry-dash", "ios", "devicectl", "backup"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/kisnner26/geode-transfer"

[project.scripts]
geode-transfer = "geode_transfer:main"

[tool.setuptools]
py-modules = ["geode_transfer"]
